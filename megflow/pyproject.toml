[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megflow"
version = "0.1.0"
description = "Milestone-gated variable-source MEG inverse experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "omegaconf>=2.3"]

[project.optional-dependencies]
anatomy = ["mne>=1.6"]
training = ["torch>=2.1"]
v15 = ["mne>=1.6", "torch>=2.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["megflow*"]
